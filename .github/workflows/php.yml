name: PHP

on: push

jobs:
  tests:
    name: Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare Laravel application
        run: composer setup

      - name: Execute tests
        run: composer test

  types:
    name: Types

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: PHPStan cache
        uses: actions/cache@v6
        with:
          path: .cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare Laravel application
        run: composer setup

      - name: Run PHPStan
        run: composer check

  style:
    name: Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: PHP-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .cache/.php-cs-fixer.cache
          key: php-cs-fixer-${{ github.sha }}
          restore-keys: php-cs-fixer-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP-CS-Fixer
        run: composer format -- --dry-run
