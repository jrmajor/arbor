name: JS

on: push

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check types
        run: pnpm check

  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: ESLint cache
        uses: actions/cache@v6
        with:
          path: .cache/eslint
          key: eslint-${{ github.sha }}
          restore-keys: eslint-

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run ESLint
        run: pnpm lint

  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Build Vite
        run: pnpm build
